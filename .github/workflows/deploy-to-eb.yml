name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


env:
  AWS_REGION: ap-northeast-1
  ECR_REPO_NAME: openproject
  APPLICATION_NAME: railway-timer
  ENVIRONMENT_NAME: Railway-timer-env
  DEPLOY_PACKAGE_NAME: app.zip
  EXPOSE_PORT: 3000

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4 # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.ECR_REPO_NAME}}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Create Dockerrun.aws.json
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{env.ECR_REPO_NAME}}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cat > Dockerrun.aws.json <<EOF
          {
            "AWSEBDockerrunVersion": "1",
            "Image": {
              "Name": "$REGISTRY/$REPOSITORY:$IMAGE_TAG",
              "Update": "true"
            },
            "Ports": [{ "ContainerPort": ${{env.EXPOSE_PORT}} }]
          }
          EOF

      - name: Create deployment package
        run: zip ${{env.DEPLOY_PACKAGE_NAME}} Dockerrun.aws.json

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          version-label: rust-${{ github.sha }}
          deployment-package-path: ${{env.DEPLOY_PACKAGE_NAME}}
          option-settings: |
            [
              {
                "Namespace": "aws:autoscaling:launchconfiguration",
                "OptionName": "IamInstanceProfile",
                "Value": "aws-elasticbeanstalk-ec2-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:environment",
                "OptionName": "ServiceRole",
                "Value": "aws-elasticbeanstalk-service-role"
              },
              {
                "Namespace": "aws:elasticbeanstalk:application:environment",
                "OptionName": "ODPT_CONSUMER_KEY",
                "Value": "${{ secrets.ODPT_CONSUMER_KEY }}"
              }
            ]