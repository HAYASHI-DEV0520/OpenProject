<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toei Timetable Explorer</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f5f7fb; color: #1f2937; }
    header { background: #003366; color: #fff; padding: 1rem; }
    main { padding: 1rem; max-width: 980px; margin: 0 auto; }
    h1, h2 { margin: 0 0 1rem; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; }
    select, button { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; }
    button { margin-top: 1rem; background: #0a61d6; color: #fff; border: none; cursor: pointer; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    pre { white-space: pre-wrap; word-break: break-word; }
    .row { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); }
    .status-panel { margin-top: 1rem; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .status-panel summary { display: flex; gap: 0.75rem; align-items: baseline; padding: 0.75rem 0.875rem; cursor: pointer; font-size: 0.875rem; color: #475569; user-select: none; }
    .status-panel summary:hover { background: #f8fafc; }
    .status-label { flex: 0 0 auto; font-weight: 700; color: #334155; }
    .status-latest { color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .status-log { max-height: 160px; overflow: auto; border-top: 1px solid #e2e8f0; background: #f8fafc; padding: 0.625rem 0.875rem; font-size: 0.75rem; line-height: 1.5; color: #334155; }
    .status-log p { margin: 0 0 0.375rem; }
    .status-log p:last-child { margin-bottom: 0; }
    .debug-card { padding: 0; overflow: hidden; }
    .debug-card summary { padding: 0.875rem 1rem; cursor: pointer; font-size: 0.875rem; color: #475569; user-select: none; }
    .debug-card summary:hover { background: #f8fafc; }
    .debug-card pre { margin: 0; padding: 0.875rem 1rem; border-top: 1px solid #e2e8f0; background: #0f172a; color: #dbeafe; font-size: 0.75rem; line-height: 1.5; max-height: 240px; overflow: auto; }
  </style>
</head>
<body>
  <header>
    <h1>Toei Timetable Explorer</h1>
  </header>
  <main>
    <div class="card">
      <h2>データソース</h2>
      <p>ODPT API から都営地下鉄のダイヤを取得します。</p>
      <details class="status-panel">
        <summary>
          <span class="status-label">状態</span>
          <span id="status" class="status-latest"></span>
        </summary>
        <div id="statusLog" class="status-log"></div>
      </details>
    </div>

    <div class="card row">
      <div>
        <label for="railway">線路</label>
        <select id="railway"></select>
      </div>
      <div>
        <label for="calendar">カレンダー</label>
        <select id="calendar"></select>
      </div>
      <div>
        <label for="direction">方向</label>
        <select id="direction"></select>
      </div>
    </div>

    <div class="card">
      <button id="loadStations">停車駅と列車を読み込む</button>
      <div id="stepControls"></div>
      <div id="result"></div>
    </div>

    <details class="card debug-card">
      <summary>デバッグ情報を表示</summary>
      <pre id="debug">まだデバッグ情報はありません。</pre>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
